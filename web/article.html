<!DOCTYPE html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>아티클 미리보기 — 멜라누아</title>
<style>
:root{--bg:#0e0e10;--panel:#17171a;--line:#2a2a30;--ink:#f3f3f4;--dim:#9a9aa2;--gold:#c2a15a}
*{box-sizing:border-box} body{margin:0;font-family:Pretendard,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
header h1{font-size:15px;margin:0;font-weight:700} header .sub{color:var(--dim);font-size:12.5px}
header .st{font-size:11.5px;color:var(--gold);border:1px solid var(--gold);border-radius:999px;padding:2px 9px}
header .rt{margin-left:auto;display:flex;gap:8px}
header button,header a{color:var(--ink);text-decoration:none;font-size:13px;border:1px solid var(--line);background:var(--panel);padding:8px 13px;border-radius:8px;cursor:pointer;font-family:inherit}
header button.pri{background:var(--gold);border-color:var(--gold);color:#1a1408;font-weight:600}
.shell{max-width:760px;margin:26px auto;padding:0 18px}
/* 장문 읽기: 흰 본문 카드, 매거진 행간 */
.post{background:#fff;color:#1f1f1f;border-radius:14px;padding:50px 48px 60px;box-shadow:0 10px 50px rgba(0,0,0,.45);line-height:1.95;font-size:16.5px;letter-spacing:-.01em}
.badges{display:flex;gap:7px;margin:0 0 16px;flex-wrap:wrap}
.badge{font-size:12px;padding:4px 11px;border-radius:999px;background:#f6f0e2;color:#8a6d2f;border:1px solid #e5d7b4;font-weight:600}
.badge.dim{background:#f3f3f2;color:#77777a;border-color:#e5e5e2;font-weight:500}
.post .ptitle{font-size:29px;font-weight:800;line-height:1.38;margin:0 0 8px;letter-spacing:-.02em}
.post .subtitle{color:#6a6a70;font-size:16.5px;margin:0 0 12px;line-height:1.65}
.post .pmeta{color:#9aa0a6;font-size:13px;margin:0 0 30px;padding-bottom:18px;border-bottom:1px solid #eee}
.post .lead{font-size:18px;line-height:1.85;color:#2a2c30;font-weight:500;margin:0 0 28px}
.post h2{font-size:20px;font-weight:700;margin:38px 0 12px;color:#111}
.post p{margin:0 0 17px;color:#33363b}
.post sup.fn{font-size:11px;color:#8a6d2f;font-weight:700;margin-left:1px;line-height:0}
.post blockquote.pq{margin:28px 0;padding:6px 0 6px 20px;border-left:3px solid var(--gold);font-size:18.5px;line-height:1.72;color:#4a3d1e;font-weight:600}
.post .figbox{margin:24px 0;border:1.5px dashed #d4b86a;background:#fbf6ea;color:#9c7a23;border-radius:12px;padding:22px;font-size:14px;text-align:center}
.post ul{margin:0 0 17px;padding-left:22px} .post li{margin:0 0 6px;color:#33363b}
.post hr{border:none;border-top:1px solid #eee;margin:32px 0}
.post ol.refs{margin:8px 0 0;padding:0;list-style:none;font-size:13.5px;color:#5b5e63;line-height:1.7}
.post ol.refs li{margin:0 0 8px}
.post ol.refs .mk{color:#8a6d2f;font-weight:700;margin-right:7px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000;border:1px solid var(--line);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1} .empty{color:var(--dim);text-align:center;padding:60px 20px}
@media(max-width:640px){.post{padding:32px 24px 40px}.post .ptitle{font-size:24px}}
</style><script src="config.js"></script></head><body>
<header>
  <h1>아티클 미리보기</h1><span class="sub" id="camp">…</span><span class="st" id="stbadge" style="display:none"></span>
  <div class="rt"><button id="copytxt">본문 텍스트 복사</button><a href="./index.html">← 콘솔</a></div>
</header>
<div class="shell"><article class="post" id="post"><div class="empty">불러오는 중…</div></article></div>
<div class="toast" id="toast"></div>
<script type="module">
const $=id=>document.getElementById(id);
const q=new URLSearchParams(location.search);
const SB_URL=window.SB_URL, SB_ANON=window.SB_ANON, slug=q.get('slug')||'';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600);}
let plain='';

const STYLE={essay:'브랜드 스토리',feature:'과학 기사',press:'보도자료',campaign:'캠페인'};
const ST={preview:'검토 대기',edited:'수정됨',approved:'승인'};

// 최소 인라인 마크다운: **굵게**, 각주 [1] → 위첨자
function inline(md){
  return esc(md)
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
    .replace(/\[(\d+)\]/g,'<sup class="fn">[$1]</sup>');
}
// 문단 블록(빈 줄 구분) — 인용(>)·목록(-) 지원
function paras(md){
  return String(md||'').split(/\n{2,}/).map(b=>b.trim()).filter(Boolean).map(b=>{
    if(/^>\s?/.test(b)) return `<blockquote class="pq">${inline(b.replace(/^>\s?/gm,'').replace(/\n/g,' '))}</blockquote>`;
    if(/^[-*]\s/.test(b)) return '<ul>'+b.split('\n').map(l=>l.replace(/^[-*]\s/,'').trim()).filter(Boolean).map(l=>`<li>${inline(l)}</li>`).join('')+'</ul>';
    return `<p>${inline(b.replace(/\n/g,' '))}</p>`;
  }).join('');
}

// 도시어 spec 렌더 — 제목/스타일 뱃지/lead/섹션(h2·pullQuote·figure)/conclusion/참고 문헌(citations)
function renderSpec(spec,a){
  const out=[];
  out.push(`<div class="badges"><span class="badge">${esc(STYLE[spec.style]||spec.style||'아티클')}</span>${spec.layer?`<span class="badge dim">${esc(spec.layer)}</span>`:''}${spec.voice?`<span class="badge dim">${esc(spec.voice)}</span>`:''}</div>`);
  out.push(`<h1 class="ptitle">${esc(spec.title||a.title||'')}</h1>`);
  if(spec.subtitle) out.push(`<p class="subtitle">${esc(spec.subtitle)}</p>`);
  out.push(`<p class="pmeta">@melanoir · 멜라누아 아티클${spec.topic?` · ${esc(spec.topic)}`:''}</p>`);
  if(spec.lead) out.push(`<p class="lead">${inline(spec.lead)}</p>`);
  for(const s of (spec.sections||[])){
    if(s.h) out.push(`<h2>${inline(s.h)}</h2>`);
    if(s.pullQuote) out.push(`<blockquote class="pq">${inline(s.pullQuote)}</blockquote>`);
    out.push(paras(s.body));
    if(s.figure){ const fg=(spec.figures||[]).find(f=>f&&f.id===s.figure); out.push(`<div class="figbox">📊 ${esc((fg&&fg.caption)||('도표 '+s.figure))}</div>`); }
  }
  if(spec.conclusion){ out.push('<hr>'); out.push(paras(spec.conclusion)); }
  const cits=Array.isArray(spec.citations)?spec.citations:[];
  if(cits.length) out.push('<h2>참고 문헌</h2><ol class="refs">'+cits.map(c=>`<li><span class="mk">[${esc(String(c.marker))}]</span>${esc(String(c.ref))}</li>`).join('')+'</ol>');
  return out.join('');
}
// spec 없는 행(과거 데이터 등): body 마크다운 간단 렌더 — # 제목줄 스킵, ##→h2, >→인용, - 목록, --- 구분선
function renderBody(a){
  const out=[`<h1 class="ptitle">${esc(a.title||'')}</h1><p class="pmeta">@melanoir · 멜라누아 아티클</p>`];
  let list=null; const flushList=()=>{ if(list){ out.push('<ul>'+list.map(x=>`<li>${inline(x)}</li>`).join('')+'</ul>'); list=null; } };
  for(const raw of String(a.body||'').split('\n')){
    const t=raw.trim();
    if(!t){ flushList(); continue; }
    if(/^#\s/.test(t)){ flushList(); continue; }              // 제목줄 — 헤더에 이미 표시
    if(/^#{2,}\s/.test(t)){ flushList(); out.push(`<h2>${inline(t.replace(/^#+\s*/,''))}</h2>`); continue; }
    if(/^(-{3,}|\*{3,})$/.test(t)){ flushList(); out.push('<hr>'); continue; }
    if(/^>\s?/.test(t)){ flushList(); out.push(`<blockquote class="pq">${inline(t.replace(/^>\s?/,''))}</blockquote>`); continue; }
    if(/^[-*]\s/.test(t)){ (list=list||[]).push(t.replace(/^[-*]\s/,'')); continue; }
    flushList(); out.push(`<p>${inline(t)}</p>`);
  }
  flushList();
  return out.join('');
}

async function load(){
  if(!(SB_URL&&SB_ANON&&slug)){ $('post').innerHTML='<div class="empty">slug/연결 없음</div>'; return; }
  const r=await fetch(`${SB_URL}/rest/v1/marketing_drafts?campaign_slug=eq.${encodeURIComponent(slug)}&channel=eq.article&select=title,body,hashtags,spec,status`,{headers:{apikey:SB_ANON,Authorization:'Bearer '+SB_ANON}});
  const rows=await r.json();
  const a=Array.isArray(rows)?rows[0]:null;
  if(!a){ $('post').innerHTML='<div class="empty">이 캠페인에 아티클이 없습니다.</div>'; return; }
  let spec=a.spec;
  if(typeof spec==='string'){ try{ spec=JSON.parse(spec); }catch{ spec=null; } }
  $('camp').textContent=a.title||(spec&&spec.title)||slug;
  if(a.status){ const b=$('stbadge'); b.textContent=ST[a.status]||a.status; b.style.display=''; }
  $('post').innerHTML=(spec&&Array.isArray(spec.sections)&&spec.sections.length)?renderSpec(spec,a):renderBody(a);
  plain=((a.title||(spec&&spec.title))?(a.title||spec.title)+'\n\n':'')+(a.body||'');
}
$('copytxt').onclick=async()=>{ try{await navigator.clipboard.writeText(plain);toast('본문 텍스트 복사됨 (검토용 마크다운)');}catch{toast('복사 실패')} };
load().catch(e=>{$('post').innerHTML='<div class="empty">오류: '+esc(e.message)+'</div>';});
</script></body></html>
