<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>마케팅 콘솔 — 발행 검토</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.24.0/dist/tabler-icons.min.css" />
<style>
  :root{
    --bg:#ffffff;--soft:#f7f7f6;--soft2:#f0f0ee;--line:#e8e8e5;--line2:#dadad6;
    --ink:#161616;--dim:#6a6a68;--faint:#9b9b98;--accent:#161616;--accent-ink:#ffffff;
    --ok:#16774a;--okbg:#e9f4ed;--warn:#875a00;--warnbg:#f8f1df;--info:#234e8a;--infobg:#eaf1fb;--danger:#9a2a2a;--dangerbg:#fbecec;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.5}
  .app{display:flex;min-height:100vh}
  /* sidebar */
  .side{width:208px;flex-shrink:0;border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh}
  .brand{display:flex;align-items:center;gap:9px;padding:4px 8px 16px;font-weight:600;font-size:15px}
  .brand i{font-size:20px}
  .nav{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;font-size:13.5px;color:var(--dim);cursor:pointer;border:1px solid transparent;user-select:none}
  .nav i{font-size:18px}
  .nav:hover{background:var(--soft)}
  .nav.on{background:var(--soft);color:var(--ink);font-weight:600;border-color:var(--line)}
  .side .foot{margin-top:auto;display:flex;align-items:center;gap:7px;padding:9px 11px;font-size:12px;color:var(--ok)}
  .side .foot.demo{color:var(--warn)}
  /* main */
  .main{flex:1;min-width:0;padding:26px 32px;max-width:1100px}
  .head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:20px}
  .head h1{margin:0;font-size:21px;font-weight:600}
  .head .sub{margin-top:3px;color:var(--dim);font-size:13.5px}
  .pill{font-size:12px;padding:4px 11px;border-radius:999px;border:1px solid var(--line2);color:var(--dim);white-space:nowrap}
  .pill.ok{background:var(--okbg);color:var(--ok);border-color:transparent}
  .pill.warn{background:var(--warnbg);color:var(--warn);border-color:transparent}
  .pill.info{background:var(--infobg);color:var(--info);border-color:transparent}
  /* card */
  .card{border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:14px;background:var(--bg)}
  .card .ch{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
  .card .ch .l{display:flex;align-items:center;gap:9px}
  .card .ch i{font-size:19px}
  .card .ch .name{font-weight:600;font-size:15px}
  .lab{font-size:11.5px;color:var(--faint);margin:12px 0 5px}
  textarea,input[type=text]{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line2);border-radius:10px;padding:11px 12px;font:14px/1.6 inherit;resize:vertical}
  textarea:focus,input:focus{outline:none;border-color:var(--ink)}
  textarea.body{min-height:120px}
  textarea.fb{min-height:54px}
  .tags{color:var(--info);font-size:13px;margin-top:8px}
  .guard{font-size:12.5px;color:var(--dim);margin-top:9px;display:flex;align-items:center;gap:6px}
  .row{display:flex;align-items:center;gap:9px;margin-top:13px;flex-wrap:wrap}
  button{font:14px inherit;border-radius:9px;padding:9px 15px;cursor:pointer;border:1px solid var(--line2);background:var(--bg);color:var(--ink);display:inline-flex;align-items:center;gap:7px;font-weight:500}
  button:hover{background:var(--soft)}
  button i{font-size:16px}
  button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  button.pri:hover{opacity:.9;background:var(--accent)}
  button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  button.sm{padding:6px 11px;font-size:13px}
  .len{margin-left:auto;color:var(--faint);font-size:12.5px}
  .imgs{display:flex;gap:9px;margin-top:12px;flex-wrap:wrap}
  .thumb{width:74px;height:92px;border-radius:9px;border:1px solid var(--line);object-fit:cover;background:var(--soft)}
  .thumb.ph{display:flex;align-items:center;justify-content:center;color:var(--faint)}
  .fbwrap{margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}
  .mini{display:flex;gap:9px;margin-top:11px}
  .mini .it{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:13px;display:flex;align-items:center;justify-content:space-between}
  .mini .it i{font-size:16px}
  .grid{display:grid;gap:12px}
  .src{border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .src img{width:100%;height:120px;object-fit:cover;display:block;background:var(--soft)}
  .src .m{padding:9px 11px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px}
  .drop{border:1.5px dashed var(--line2);border-radius:12px;padding:26px;text-align:center;color:var(--dim);font-size:13.5px}
  .drop i{font-size:26px;display:block;margin-bottom:8px;color:var(--faint)}
  .kv{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
  .kv:last-child{border-bottom:0}
  .kv .k{color:var(--dim);font-size:13px;display:flex;align-items:center;gap:7px}
  .kv .v{font-weight:500}
  .lock{font-size:11px;color:var(--warn);background:var(--warnbg);padding:2px 8px;border-radius:999px;display:inline-flex;align-items:center;gap:4px}
  .chip{display:inline-block;font-size:12.5px;padding:4px 10px;border:1px solid var(--line2);border-radius:999px;margin:0 6px 6px 0}
  .chip.no{color:var(--danger);border-color:transparent;background:var(--dangerbg)}
  .rule{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13.5px}
  .rule:last-child{border-bottom:0}
  .rule .b{font-size:11px;padding:2px 8px;border-radius:6px}
  .rule .b.do{background:var(--okbg);color:var(--ok)} .rule .b.dont{background:var(--dangerbg);color:var(--danger)}
  .rule .sc{color:var(--faint);font-size:12px;margin-left:auto}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
  .cal .d{border:1px solid var(--line);border-radius:9px;min-height:74px;padding:7px 8px;font-size:12px}
  .cal .d .n{color:var(--faint);font-size:11px}
  .cal .d .t{margin-top:4px;font-size:11.5px;line-height:1.35}
  .cal .d.published{background:var(--okbg)} .cal .d.review{background:var(--infobg)} .cal .d.scheduled{background:var(--soft)}
  .toggle{width:38px;height:22px;border-radius:999px;background:var(--line2);position:relative;cursor:pointer;flex-shrink:0}
  .toggle.on{background:var(--ink)}
  .toggle::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.15s}
  .toggle.on::after{left:19px}
  .note{font-size:12.5px;color:var(--dim)}
  /* 원본↔수정본 diff */
  .diffwrap{margin-top:12px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .diffhead{padding:8px 12px;background:var(--soft);font-size:12px;color:var(--dim);display:flex;align-items:center;gap:10px}
  .diffhead .tag{padding:1px 7px;border-radius:5px;font-weight:600}
  .dline{font:12.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;padding:1px 12px;white-space:pre-wrap;word-break:break-word;display:flex;gap:8px}
  .dline .dmark{width:10px;flex-shrink:0;color:var(--faint);user-select:none}
  .dline.del{background:var(--dangerbg);color:var(--danger)}
  .dline.add{background:var(--okbg);color:var(--ok)}
  .dline.eq{color:var(--dim)}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:9}
  .toast.show{opacity:1}
  h2.sec{font-size:16px;font-weight:600;margin:0 0 12px}
  /* ── 채널별 뷰 ── */
  .chvbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
  .chvtab{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border:1px solid var(--line2);border-radius:999px;cursor:pointer;font-size:13px;color:var(--dim);background:var(--bg);user-select:none}
  .chvtab:hover{background:var(--soft)}
  .chvtab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chvtab i{font-size:15px} .chvtab .ct{font-size:11px;opacity:.7}
  .chvfilter{display:flex;gap:7px;align-items:center;margin:0 0 18px}
  .fchip{padding:5px 12px;border:1px solid var(--line2);border-radius:999px;cursor:pointer;font-size:12.5px;color:var(--dim);user-select:none}
  .fchip:hover{background:var(--soft)}
  .fchip.on{border-color:var(--ink);color:var(--ink);font-weight:600;background:var(--soft)}
  /* IG 갤러리 */
  .iggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
  .igcell{position:relative;aspect-ratio:1/1;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--soft);cursor:pointer}
  .igcell img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s}
  .igcell:hover img{transform:scale(1.045)}
  .igcell .multi{position:absolute;top:7px;right:8px;color:#fff;filter:drop-shadow(0 1px 3px rgba(0,0,0,.7));font-size:17px}
  .igcell .cap{position:absolute;left:0;right:0;bottom:0;padding:16px 10px 8px;background:linear-gradient(transparent,rgba(0,0,0,.66));color:#fff;font-size:11.5px;line-height:1.4;opacity:0;transition:opacity .2s}
  .igcell:hover .cap{opacity:1}
  .igcell.ph{display:flex;align-items:center;justify-content:center;color:var(--faint);cursor:default}
  .igcell.ph i{font-size:26px}
  /* 텍스트 채널 피드 */
  .txcard{border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px;background:var(--bg)}
  .txcard .top{display:flex;align-items:center;gap:10px;margin-bottom:11px}
  .txcard .av{width:38px;height:38px;border-radius:50%;background:var(--soft2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .txcard .av i{font-size:20px} .txcard .who{font-weight:600;line-height:1.3}
  .txcard .who .h{color:var(--dim);font-weight:400;font-size:12px;display:flex;align-items:center;gap:6px;margin-top:2px}
  .txcard .ttl{font-weight:600;margin-bottom:6px} .txcard .txt{white-space:pre-wrap;line-height:1.72}
  .txcard .tags{color:var(--info);margin-top:11px;font-size:13.5px}
  /* 블로그/인사이트 갤러리 */
  .blgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
  .blcard{border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;background:var(--bg);transition:box-shadow .15s,transform .15s}
  .blcard:hover{box-shadow:0 8px 26px rgba(0,0,0,.08);transform:translateY(-2px)}
  .blcard .cov{width:100%;aspect-ratio:16/10;object-fit:cover;background:var(--soft);display:block}
  .blcard .cov.ph{display:flex;align-items:center;justify-content:center;color:var(--faint)}
  .blcard .cov.ph i{font-size:28px}
  .blcard .m{padding:13px 15px}
  .blcard .m .t{font-weight:600;font-size:14.5px;line-height:1.4;margin-bottom:6px}
  .blcard .m .ex{color:var(--dim);font-size:12.5px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  /* 라이트박스 (공통) */
  .lb{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:50;display:flex;align-items:center;justify-content:center;padding:24px}
  .lb .box{background:#fff;border-radius:14px;overflow:hidden;max-width:960px;width:100%;max-height:92vh;display:flex;box-shadow:0 20px 80px rgba(0,0,0,.5)}
  .lb .x{position:absolute;top:16px;right:20px;z-index:2;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;border:none;cursor:pointer;font-size:17px;line-height:1}
  .lb .stage{position:relative;flex:0 0 auto;width:min(60vh,540px);background:#000;display:flex;align-items:center;justify-content:center}
  .lb .stage img{max-width:100%;max-height:92vh;display:block;object-fit:contain}
  .lb .nav{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.92);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#111;font-size:22px;line-height:1}
  .lb .nav.prev{left:10px} .lb .nav.next{right:10px}
  .lb .nav:disabled{opacity:.3;cursor:default}
  .lb .dots{position:absolute;bottom:10px;left:0;right:0;display:flex;gap:5px;justify-content:center}
  .lb .dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.5)}
  .lb .dots i.on{background:#fff}
  .lb .side{flex:1;min-width:0;display:flex;flex-direction:column;color:#1f1f1f}
  .lb .side .top{display:flex;align-items:center;gap:9px;padding:15px 17px;border-bottom:1px solid #eee;font-weight:600}
  .lb .side .top i{font-size:19px}
  .lb .side .cont{padding:15px 17px;overflow:auto;white-space:pre-wrap;line-height:1.72;font-size:14px;color:#33363b}
  .lb .side .tags{color:#1a73c0;padding:0 17px 15px;font-size:13.5px}
  /* 읽기뷰(블로그/인사이트) */
  .readlb .box{max-width:760px}
  .readlb .rd{overflow:auto;max-height:92vh;background:#fff;color:#1f1f1f;width:100%}
  .readlb .rd .cov{width:100%;max-height:340px;object-fit:cover;display:block;background:#eee}
  .readlb .rd .bd{padding:34px 42px 46px;line-height:1.9;font-size:16px;letter-spacing:-.01em}
  .readlb .rd .bd h1{font-size:25px;font-weight:800;line-height:1.35;margin:0 0 6px}
  .readlb .rd .bd .meta{color:#9aa0a6;font-size:13px;margin:0 0 26px;padding-bottom:16px;border-bottom:1px solid #eee}
  .readlb .rd .bd p{margin:0 0 15px;color:#33363b}
  .readlb .rd .bd h2{font-size:19px;font-weight:700;margin:30px 0 10px;color:#111}
  .readlb .rd .bd .tags{margin-top:26px;color:#1a73c0;font-size:14px}
  /* 상태 스티커 */
  .sticker{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap}
  .sticker i{font-size:12px}
  .sticker.edit{background:var(--infobg);color:var(--info)}
  .sticker.fin{background:var(--okbg);color:var(--ok)}
  .sticker.rej{background:var(--dangerbg);color:var(--danger)}
  .igcell .stk,.blcard .stk{position:absolute;top:8px;left:8px;z-index:1}
  .igcell .stk .sticker,.blcard .stk .sticker{box-shadow:0 1px 5px rgba(0,0,0,.18)}
  .blcard{position:relative}
  /* 라이트박스 편집(IG 캡션) */
  .lb .side .ed{padding:12px 17px 16px;display:flex;flex-direction:column;gap:9px}
  .edbody{width:100%;border:1px solid #ddd;border-radius:9px;padding:10px 11px;font:14px/1.6 inherit;color:#1f1f1f;resize:vertical}
  .lb .side .edbody{min-height:120px}
  .edbody:focus{outline:none;border-color:#111}
  .edrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .edrow .grow{margin-left:auto}
  .lbbtn{font:13px inherit;border-radius:8px;padding:8px 13px;cursor:pointer;border:1px solid #d5d5d2;background:#fff;color:#1f1f1f;display:inline-flex;align-items:center;gap:6px;font-weight:600;text-decoration:none}
  .lbbtn:hover{background:#f4f4f2}
  .lbbtn.pri{background:#161616;color:#fff;border-color:#161616}
  .lbbtn.pri:hover{opacity:.9;background:#161616}
  .lbbtn i{font-size:15px}
  /* 텍스트 피드 편집 */
  .txcard .edbody{background:var(--bg);color:var(--ink);border-color:var(--line2);min-height:96px}
  .txcard .edbody:focus{border-color:var(--ink)}
  .txcard .edrow{margin-top:9px}
  /* 블로그 읽기뷰 편집 */
  .readlb .rd .bd .editsec{margin-top:28px;border-top:1px solid #eee;padding-top:18px}
  .readlb .rd .bd .editsec .lab2{font-size:12px;color:#9aa0a6;margin-bottom:8px;font-weight:600;display:flex;align-items:center;gap:8px}
  .readlb .rd .bd .editsec .edbody{min-height:180px;font-size:14.5px;line-height:1.7}
  .readlb .rd .bd .editsec .edrow{margin-top:11px}
  /* 방향 피드백(다음 생성·파생 학습) */
  .chvfb{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
  .chvfb .lab2{font-size:12px;color:var(--faint);margin-bottom:7px;font-weight:600}
  .chvfb .fbnote{width:100%;min-height:52px;border:1px solid var(--line2);border-radius:9px;padding:9px 11px;font:13.5px/1.5 inherit;resize:vertical;background:var(--bg);color:var(--ink);margin-bottom:8px}
  .chvfb .fbnote:focus{outline:none;border-color:var(--ink)}
  .lb .side .chvfb,.readlb .chvfb{border-top-color:#eee}
  .lb .side .chvfb .lab2,.readlb .chvfb .lab2{color:#9aa0a6}
  .lb .side .chvfb .fbnote,.readlb .chvfb .fbnote{border-color:#ddd;color:#1f1f1f;background:#fff}
  .lbbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  /* 파생 출처 표시 */
  .srcline{font-size:12px;color:var(--dim);margin:2px 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .srcline i{font-size:14px}
  .lb .side .srcline,.readlb .srcline{color:#6a6a68}
  /* 발행하기 모달 */
  .pub-modal .box{max-width:460px}
  .pub-modal .pm{padding:22px 24px 24px;width:100%;color:var(--ink);background:var(--bg)}
  .pub-modal h3{margin:0 0 4px;font-size:18px;font-weight:700}
  .pub-modal .pmsub{color:var(--dim);font-size:13px;margin-bottom:8px;line-height:1.5}
  .pub-modal label{display:block;font-size:12px;color:var(--dim);margin:14px 0 5px}
  .pub-modal input,.pub-modal textarea{width:100%;border:1px solid var(--line2);border-radius:9px;padding:10px 12px;font:14px/1.5 inherit;background:var(--bg);color:var(--ink)}
  .pub-modal textarea{min-height:58px;resize:vertical}
  .pub-modal .warn{margin-top:14px;font-size:12px;color:var(--warn);background:var(--warnbg);border-radius:8px;padding:9px 11px;line-height:1.5;display:flex;gap:7px;align-items:flex-start}
  .pub-modal .pmrow{display:flex;gap:9px;margin-top:18px}
  .pub-modal .pmrow .grow{margin-left:auto}
  .pub-modal .pmnote{margin-top:13px;font-size:12px;color:var(--dim);line-height:1.6}
  .pub-modal code{background:var(--soft2);padding:1px 6px;border-radius:5px;font-size:12px}
  .pub-modal .chkrow{display:flex;flex-wrap:wrap;gap:8px}
  .pub-modal .chk{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:9px;padding:8px 11px;font-size:13px;cursor:pointer;width:auto;user-select:none}
  .pub-modal .chk:hover{background:var(--soft)}
  .pub-modal .chk i{font-size:15px}
  .pub-modal .chk input{width:auto;margin:0}
  @media(max-width:720px){.side{width:60px}.side .brand span,.nav span,.side .foot span{display:none}.main{padding:18px}}
  @media(max-width:640px){.lb{padding:0}.lb .box{flex-direction:column;max-height:100vh;height:100vh;border-radius:0}.lb .stage{width:100%;max-height:50vh}.lb .stage img{max-height:50vh}.readlb .rd .bd{padding:22px 20px 32px}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><i class="ti ti-broadcast"></i><span>마케팅 콘솔</span></div>
    <div class="nav on" data-s="today"><i class="ti ti-clipboard-check"></i><span>오늘 발행</span></div>
    <div class="nav" data-s="channels"><i class="ti ti-layout-grid"></i><span>채널별 뷰</span></div>
    <div class="nav" data-s="facts"><i class="ti ti-checklist"></i><span>사실 검증</span></div>

// sources 테이블 행 → 콘솔 소스 탭 형식 {images:[],guidelines}
function mapSources(rows){

async function patch(id, fields){
  if(DEMO){ toast('데모 모드 — 저장 안 됨 (config.js 연결 시 실제 저장)'); return true; }

}
// 피드백 → feedback 테이블 INSERT (verdict+note+edited_body) → pull/distill 학습 입력.
//   editedBody 를 명시하면 그 값을, 아니면 현재 본문(d.body)을 저장한다.
//   verdict='edit' 는 [수정 저장]이 만드는 자동 학습 신호(원본↔수정본 diff 재료).
async function insertFeedback(d, verdict, note, editedBody){
  if(DEMO){ toast('데모 모드 — 피드백 저장 안 됨'); return false; }
  const { error } = await sb.from('feedback').insert({
    draft_id:d.id, campaign_slug:d.campaign_slug||(DATA.campaign||{}).slug||null,
    channel:d.channel, verdict:verdict||null, note:note||null,
    edited_body:(editedBody!==undefined?editedBody:d.body)||null });

}
// 지침 → sources(kind='guideline') upsert. 기존 guideline 행 갱신, 없으면 생성.
async function saveGuideline(text){
  if(DEMO) return false;
  const { data:ex } = await sb.from('sources').select('id').eq('kind','guideline').limit(1);
  if(ex&&ex.length){ const { error } = await sb.from('sources').update({text,active:true}).eq('id',ex[0].id); return !error; }
  const { error } = await sb.from('sources').insert({kind:'guideline',text,label:'브랜드 보이스',active:true}); return !error;
}

function fullText(d){
  const tags=d.hashtags||[]; const body=(d.title?d.title+'\n\n':'')+(d.body||'');
  return (tags.length && !body.includes(tags[0])) ? body+'\n\n'+tags.join(' ') : body;
}
const stPill = s => s==='approved'?'<span class="pill ok">승인</span>':s==='edited'?'<span class="pill info">수정됨</span>':'<span class="pill">검토 대기</span>';

// 라인 단위 diff (LCS) — 원본(a) 대비 현재(b)의 삭제(−)/추가(+)/유지 표시
function lineDiff(a, b){
  const A=String(a==null?'':a).split('\n'), B=String(b==null?'':b).split('\n');
  const n=A.length, m=B.length;
  const dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--)
    dp[i][j]=A[i]===B[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const out=[]; let i=0,j=0;
  while(i<n&&j<m){
    if(A[i]===B[j]){out.push({t:'eq',s:A[i]});i++;j++;}
    else if(dp[i+1][j]>=dp[i][j+1]){out.push({t:'del',s:A[i]});i++;}
    else{out.push({t:'add',s:B[j]});j++;}
  }
  while(i<n)out.push({t:'del',s:A[i++]});
  while(j<m)out.push({t:'add',s:B[j++]});
  return out;
}
function diffHtml(orig, cur){
  const d=lineDiff(orig,cur);
  const changed=d.some(x=>x.t!=='eq');
  const body=d.map(x=>`<div class="dline ${x.t}"><span class="dmark">${x.t==='del'?'−':x.t==='add'?'+':''}</span>${esc(x.s)||'&nbsp;'}</div>`).join('');
  return `<div class="diffhead"><span class="tag del" style="background:var(--dangerbg)">− 원본</span><span class="tag add" style="background:var(--okbg)">+ 현재</span>${changed?'':'<span style="margin-left:auto">원본과 동일 — 변경 없음</span>'}</div>${body}`;
}

// ── 오늘 발행 ────────────────────────────────────────────────────────────────
function renderToday(){
  const c=DATA.campaign||{}; const ds0=DATA.drafts||[];
  // 캠페인별로 묶어 최신순 — IG가 쭉 나열되지 않게(채널은 instagram→linkedin→threads→naver-blog 순)

  const keyOf=d=>d.campaign_slug||String(d.id);

  const grpCount={}; for(const d of ds0){const k=keyOf(d); grpCount[k]=(grpCount[k]||0)+1;}
  const ds=[...ds0].sort((a,b)=>(latestOf[keyOf(b)]-latestOf[keyOf(a)])||keyOf(a).localeCompare(keyOf(b))||((chOrder[a.channel]??9)-(chOrder[b.channel]??9)));

    const tags=d.hashtags||[];
    const imgs=(d.image_urls||[]).map(u=>`<img class="thumb" src="${esc(u)}" loading="lazy" alt="">`).join('')
      || '<div class="thumb ph"><i class="ti ti-photo"></i></div>';
    return header + `<div class="card" data-id="${esc(d.id)}">
      <div class="ch"><div class="l"><i class="ti ${m.icon}"></i><span class="name">${esc(m.label)}</span>${stPill(d.status)}</div>
        <span style="display:flex;gap:6px">${(d.channel==='instagram'&&d.spec&&d.spec.slides)?`<a class="pill" href="cards.html?slug=${encodeURIComponent(d.campaign_slug||'')}" style="text-decoration:none;border-color:var(--gold);color:var(--gold)"><i class="ti ti-photo-edit" style="font-size:12px"></i> 카드 편집</a>`:''}${d.channel==='naver-blog'?`<a class="pill" href="blog.html?slug=${encodeURIComponent(d.campaign_slug||'')}" style="text-decoration:none;border-color:var(--gold);color:var(--gold)"><i class="ti ti-article" style="font-size:12px"></i> 블로그 미리보기</a>`:''}${d.channel==='insight'?`<a class="pill" href="insight.html?slug=${encodeURIComponent(d.campaign_slug||'')}" style="text-decoration:none;border-color:var(--gold);color:var(--gold)"><i class="ti ti-article" style="font-size:12px"></i> 자사몰 카드 미리보기</a>`:''}${d.channel==='article'?`<a class="pill" href="article.html?slug=${encodeURIComponent(d.campaign_slug||'')}" style="text-decoration:none;border-color:var(--gold);color:var(--gold)"><i class="ti ti-news" style="font-size:12px"></i> 아티클 미리보기</a>`:''}<a class="pill" href="${esc(m.url)}" target="_blank" style="text-decoration:none">플랫폼 열기 <i class="ti ti-external-link" style="font-size:12px"></i></a></span></div>
      <div class="lab">본문 (직접 수정 가능)</div>
      <textarea class="body">${esc(d.body||'')}</textarea>
      ${tags.length?`<div class="tags">${esc(tags.join(' '))}</div>`:''}
      ${d.guardian_notes?`<div class="guard"><i class="ti ti-shield-check" style="color:var(--ok)"></i> 검수 ${esc(d.guardian_notes)}</div>`:''}
      ${(()=>{const cs=(d.body||'').split('\n').filter(l=>/^\s*🖼/.test(l));return cs.length?'<div class="lab" style="margin-top:8px">🖼 이미지 배치 — 글에서 이 위치·내용으로 삽입</div>'+cs.map(l=>`<div style="background:#1c1708;border:1px solid var(--gold);border-radius:8px;padding:7px 11px;margin:5px 0;font-size:12.5px;color:#d8c08a">${esc(l.replace(/^\s*🖼\s*/,'🖼 '))}</div>`).join(''):'';})()}
      <div class="imgs">${imgs}</div>
      <div class="row">
        <button class="pri act-copy"><i class="ti ti-copy"></i> 본문 복사</button>
        <button class="act-save"><i class="ti ti-device-floppy"></i> 수정 저장</button>
        <button class="act-appr"><i class="ti ti-check"></i> 승인</button>

        <div class="lab" style="margin-top:0">피드백 — 다음 생성 학습에 반영</div>

      <span class="pill">${DEMO?'데모 모드':'비공개 링크'}</span></div></div>${cards}`;
  const pubBtn=$('pubday'); if(pubBtn) pubBtn.onclick=openPublishModal;

  ds.forEach(d=>{
    const el=$('view').querySelector(`[data-id="${CSS.escape(d.id)}"]`); if(!el) return;
    const body=el.querySelector('.body'), len=el.querySelector('.len');
    const upd=()=>len.textContent=`${fullText({...d,body:body.value}).length}자`; upd();
    body.addEventListener('input',upd);
    el.querySelector('.act-copy').onclick=async e=>{
      try{await navigator.clipboard.writeText(fullText({...d,body:body.value}))}catch{body.select();document.execCommand('copy')}
      const b=e.currentTarget,o=b.innerHTML; b.innerHTML='<i class="ti ti-check"></i> 복사됨'; setTimeout(()=>b.innerHTML=o,1300);
    };
    // 원본 대조 — 원본(original_body) 대비 현재 본문의 라인 diff 토글
    const diffBtn=el.querySelector('.act-diff'), diffWrap=el.querySelector('.diffwrap');
    const showDiff=()=>{ diffWrap.innerHTML=diffHtml(d.original_body!=null?d.original_body:d.body, body.value); };
    diffBtn.onclick=()=>{
      const open=diffWrap.style.display!=='none';
      if(open){ diffWrap.style.display='none'; diffBtn.classList.remove('on'); return; }
      showDiff(); diffWrap.style.display='block'; diffBtn.classList.add('on');
    };
    el.querySelector('.act-save').onclick=async()=>{
      const nb=body.value, orig=(d.original_body!=null?d.original_body:d.body);
      if(!(await patch(d.id,{body:nb,status:'edited'}))) return;
      const edited = nb!==orig;
      d.body=nb; d.status='edited';
      // 본문이 원본과 달라졌으면 편집 자체를 학습 신호로 기록(verdict='edit', edited_body=신본).
      if(edited && !DEMO) await insertFeedback(d,'edit',null,nb);
      if(diffWrap.style.display!=='none') showDiff(); // 대조 열려 있으면 저장 후 갱신
      toast(edited?'본문 저장 · 수정이 학습 신호로 기록됨':'본문 저장됨');
    };
    el.querySelector('.act-appr').onclick=async()=>{ if(await patch(d.id,{status:'approved'})){d.status='approved';renderToday()} };
    const fb=el.querySelector('.fb'); let sent=null;
    el.querySelector('.act-up').onclick=e=>{sent='up';el.querySelector('.act-up').classList.add('on');el.querySelector('.act-down').classList.remove('on')};
    el.querySelector('.act-down').onclick=e=>{sent='down';el.querySelector('.act-down').classList.add('on');el.querySelector('.act-up').classList.remove('on')};
    el.querySelector('.act-fbsave').onclick=async()=>{
      if(!sent && !fb.value.trim()){ toast('잘됨/아쉬움 또는 메모를 입력하세요'); return; }
      const okFb=await insertFeedback(d,sent,fb.value);
      if(okFb||DEMO){ await patch(d.id,{feedback:fb.value}); d.feedback=fb.value; toast('피드백 저장됨 — pull→distill 학습 반영') }
    };
  });
}

// ── 채널별 뷰 ────────────────────────────────────────────────────────────────
// 발행 결과를 채널 화면처럼 확인: IG=갤러리→캐러셀, LinkedIn/Threads=텍스트 피드,
// naver-blog/insight=갤러리→블로그식 읽기뷰. 열람 전용(쓰기 없음).
const CHV_ORDER=['instagram','linkedin','threads','naver-blog','insight','article'];
let chv={ ch:null, status:'active' };
const isPublished = d => d.status==='approved' || d.status==='published';
const isFinal = d => d.status==='approved' || d.status==='published';
const chvExcerpt = (d,n) => { const t=(d.body||'').replace(/\s+/g,' ').trim(); return t.length>n?t.slice(0,n)+'…':t; };
// 상태 스티커 — 확정(승인/발행) vs 수정 가능(초안/검토/수정본)
const chvSticker = d => d.status==='rejected'
  ? '<span class="sticker rej"><i class="ti ti-ban"></i>반려</span>'
  : isFinal(d)
  ? '<span class="sticker fin"><i class="ti ti-circle-check"></i>확정</span>'
  : '<span class="sticker edit"><i class="ti ti-pencil"></i>수정 가능</span>';
const rejLabel = d => d.status==='rejected' ? '<i class="ti ti-arrow-back-up"></i> 복원' : '<i class="ti ti-ban"></i> 반려';
// 파생 출처: 같은 campaign_slug의 원본 IG(파생본이 만들어진 근거). IG 자신은 null.
const chvSourceIG = d => d.channel==='instagram' ? null : ((DATA.drafts||[]).find(x=>x.channel==='instagram'&&x.campaign_slug===d.campaign_slug)||null);
// 이 캠페인에서 IG로부터 파생된 채널 라벨들
const chvDerived = d => (DATA.drafts||[]).filter(x=>x.campaign_slug===d.campaign_slug&&x.channel!=='instagram').map(x=>(CH[x.channel]||{}).label||x.channel);
// 채널 뷰 공용 저장 — 오늘 발행과 동일 규칙(본문 변경 시 verdict='edit' 학습 신호 기록)
async function chvSave(d, newBody){
  const orig=(d.original_body!=null?d.original_body:d.body);
  if(!(await patch(d.id,{body:newBody,status:'edited'}))) return false;
  const edited=newBody!==orig; d.body=newBody; d.status='edited';
  if(edited && !DEMO) await insertFeedback(d,'edit',null,newBody);
  return true;
}
async function chvApprove(d){ if(await patch(d.id,{status:'approved'})){ d.status='approved'; return true; } return false; }
// 반려/복원 — 반려하면 활성 목록에서 숨김(로그엔 남음). 복원하면 edited 로 되돌림.
async function chvReject(d, reject){ const s=reject?'rejected':'edited'; if(await patch(d.id,{status:s})){ d.status=s; return true; } return false; }
// 방향 피드백 블록 — 직접 수정과 별개로 '다음 생성·파생' 학습에 반영(잘됨/아쉬움 + 메모 → feedback → distill → learnings)
const chvFbBlock = () => `<div class="chvfb">
  <div class="lab2">방향 피드백 — 다음 생성·파생 학습에 반영 (직접 수정과 별개)</div>
  <textarea class="fbnote" placeholder="예: 톤이 너무 딱딱함, 더 대화체로. 첫 줄 후킹 약함. 근거 한 줄 추가."></textarea>
  <div class="edrow"><button class="lbbtn fb-up"><i class="ti ti-thumb-up"></i> 잘됨</button>
    <button class="lbbtn fb-down"><i class="ti ti-thumb-down"></i> 아쉬움</button>
    <button class="lbbtn pri fb-save grow"><i class="ti ti-send"></i> 피드백 저장</button></div></div>`;
function bindChvFb(scope, d){
  const up=scope.querySelector('.fb-up'), down=scope.querySelector('.fb-down'), note=scope.querySelector('.fbnote'), save=scope.querySelector('.fb-save');
  if(!save) return; let verdict=null;
  up.onclick=()=>{verdict='up';up.classList.add('on');down.classList.remove('on');};
  down.onclick=()=>{verdict='down';down.classList.add('on');up.classList.remove('on');};
  save.onclick=async()=>{
    if(!verdict && !note.value.trim()){ toast('잘됨/아쉬움 또는 메모를 입력하세요'); return; }
    const ok=await insertFeedback(d, verdict, note.value);
    if(ok||DEMO) toast('방향 피드백 저장됨 — 다음 생성·파생에 반영');
  };
}
// 요청 → content_requests 큐(Claude 처리 커맨드 /melanoir-queue 가 감지·gold 생성·파생). anon insert.
async function enqueueRequest(payload){
  if(DEMO) return {ok:false,reason:'demo'};
  const { error } = await sb.from('content_requests').insert({ source:'console', ...payload });
  if(error){ const missing=/relation|does not exist|not found|schema cache|content_requests/i.test(error.message||''); return {ok:false,reason:error.message,missing}; }
  return {ok:true};
}
const enqueueGeneration = ({topic,note}) => enqueueRequest({ type:'generate', topic:topic||null, note:note||null });
const enqueueDerive = ({source,channels,note}) => enqueueRequest({ type:'derive', source_slug:source||null, channels:channels||[], note:note||null });

function renderChannels(){
  const ds=DATA.drafts||[];
  const counts={}; ds.forEach(d=>counts[d.channel]=(counts[d.channel]||0)+1);
  const chans=CHV_ORDER.filter(c=>counts[c]);
  Object.keys(counts).forEach(c=>{ if(!chans.includes(c)) chans.push(c); }); // 맵에 없는 채널도 뒤에
  if(!chv.ch || !counts[chv.ch]) chv.ch = chans[0] || 'instagram';

  const tabs=chans.map(c=>{ const m=CH[c]||{label:c,icon:'ti-file'};
    return `<div class="chvtab ${c===chv.ch?'on':''}" data-ch="${esc(c)}"><i class="ti ${m.icon}"></i>${esc(m.label)}<span class="ct">${counts[c]}</span></div>`; }).join('');
  const filter=`<div class="chvfilter"><span class="note">상태</span>
    <span class="fchip ${chv.status==='active'?'on':''}" data-st="active">활성</span>
    <span class="fchip ${chv.status==='pub'?'on':''}" data-st="pub">발행됨</span>
    <span class="fchip ${chv.status==='rejected'?'on':''}" data-st="rejected">반려</span></div>`;

  let rows=ds.filter(d=>d.channel===chv.ch);
  if(chv.status==='active') rows=rows.filter(d=>d.status!=='rejected');
  else if(chv.status==='pub') rows=rows.filter(isPublished);
  else if(chv.status==='rejected') rows=rows.filter(d=>d.status==='rejected');
  rows=rows.slice().sort((a,b)=>(Date.parse(b.created_at)||0)-(Date.parse(a.created_at)||0));

  const m=CH[chv.ch]||{label:chv.ch,url:'#'};
  const body=chvBody(chv.ch,rows) || '<div class="note" style="margin-top:8px">이 조건에 표시할 콘텐츠가 없습니다.</div>';
  $('view').innerHTML=`<div class="head"><div><h1>채널별 뷰</h1>
    <div class="sub">발행 결과를 채널 화면처럼 확인 · ${esc(m.label)} ${rows.length}건</div></div>
    <a class="pill" href="${esc(m.url||'#')}" target="_blank" style="text-decoration:none">플랫폼 열기 <i class="ti ti-external-link" style="font-size:12px"></i></a></div>
    <div class="chvbar">${tabs}</div>${filter}${body}`;

  $('view').querySelectorAll('.chvtab').forEach(t=>t.onclick=()=>{ chv.ch=t.dataset.ch; renderChannels(); });
  $('view').querySelectorAll('.fchip').forEach(t=>t.onclick=()=>{ chv.status=t.dataset.st; renderChannels(); });
  chvBind(chv.ch,rows);
}
function chvBody(ch,rows){

function blogGallery(rows){

function chvBind(ch,rows){
  const v=$('view');
  if(ch==='instagram'){
    v.querySelectorAll('.igcell[data-i]').forEach(c=>c.onclick=()=>openCarousel(rows[+c.dataset.i]));
  } else if(ch==='linkedin'||ch==='threads'||(!rows.some(d=>(d.image_urls||[]).length) && ch!=='naver-blog' && ch!=='insight' && ch!=='article')){
    v.querySelectorAll('.txcard').forEach(card=>{
      const d=rows[+card.dataset.i], body=card.querySelector('.tx-body');
      card.querySelector('.tx-copy').onclick=async b=>{
        try{ await navigator.clipboard.writeText(fullText({...d,body:body.value})); }catch{}
        const btn=b.currentTarget,o=btn.innerHTML; btn.innerHTML='<i class="ti ti-check"></i>'; setTimeout(()=>btn.innerHTML=o,1200);
      };
      card.querySelector('.tx-save').onclick=async()=>{
        if(await chvSave(d,body.value)){ card.querySelector('.tx-stk').innerHTML=chvSticker(d); toast(DEMO?'데모 모드':'본문 저장됨'); }
      };
      card.querySelector('.tx-appr').onclick=async()=>{ if(await chvApprove(d)){ card.querySelector('.tx-stk').innerHTML=chvSticker(d); toast('승인됨 · 확정'); } };
      card.querySelector('.tx-reject').onclick=async()=>{ const toRej=d.status!=='rejected'; if(await chvReject(d,toRej)){ toast(toRej?'반려됨 — 활성 목록에서 숨김':'복원됨'); renderChannels(); } };
      const osrc=card.querySelector('.opensrc'); if(osrc) osrc.onclick=()=>{ const ig=(DATA.drafts||[]).find(x=>x.channel==='instagram'&&x.campaign_slug===osrc.dataset.slug); if(ig) openCarousel(ig); else toast('원본 IG 없음'); };
      bindChvFb(card, d);

}

    <div class="pmsub"><b>${esc(src.title||src.campaign_slug||'')}</b> 인스타 카드뉴스를 기준으로 선택한 채널 콘텐츠를 생성합니다. 완료되면 같은 캠페인에 채널별로 추가됩니다.</div>
    <label>대상 채널</label>
    <div class="chkrow">${targets.map(([k,l])=>`<label class="chk"><input type="checkbox" value="${k}" checked> <i class="ti ${(CH[k]||{}).icon||'ti-file'}"></i> ${esc(l)}</label>`).join('')}</div>
    <label>메모 <span class="note">(선택 — 강조점·톤)</span></label>
    <textarea id="dmnote" placeholder="예: 블로그는 길게, 쓰레드는 짧고 담백하게"></textarea>
    <div class="warn"><i class="ti ti-alert-triangle"></i><span>요청은 큐에 담길 뿐 무료입니다. 실제 파생 생성은 Claude 구독 토큰을 소모합니다.</span></div>
    <div class="pmrow"><button class="lbbtn" id="dmcancel">취소</button>
      <button class="lbbtn pri grow" id="dmsend"><i class="ti ti-arrows-split-2"></i> 파생 요청 보내기</button></div>
    <div class="pmnote" id="dmresult"></div>
  </div></div>`;
  document.body.appendChild(el);
  el.querySelector('.x').onclick=lbClose; el.querySelector('#dmcancel').onclick=lbClose;
  el.onclick=e=>{ if(e.target===el) lbClose(); };
  lbKey=e=>{ if(e.key==='Escape')lbClose(); }; document.addEventListener('keydown',lbKey);
  el.querySelector('#dmsend').onclick=async()=>{
    const channels=[...el.querySelectorAll('.chkrow input:checked')].map(c=>c.value);
    const box=el.querySelector('#dmresult');
    if(!channels.length){ box.textContent='채널을 하나 이상 선택하세요.'; return; }
    const btn=el.querySelector('#dmsend'), o=btn.innerHTML; btn.disabled=true; btn.innerHTML='요청 중…';
    const res=await enqueueDerive({source:src.campaign_slug, channels, note:el.querySelector('#dmnote').value.trim()});
    if(res.ok){ box.innerHTML=`<span style="color:var(--ok)"><i class="ti ti-check"></i> 파생 요청됨 — 처리 커맨드가 곧 ${channels.length}개 채널을 생성합니다.</span>`; btn.innerHTML='<i class="ti ti-check"></i> 요청됨'; }
    else if(res.reason==='demo'){ box.textContent='데모 모드 — 실제 요청은 Supabase 연결 시 전송됩니다.'; btn.disabled=false; btn.innerHTML=o; }
    else if(res.missing){ box.innerHTML='큐 테이블(<code>content_requests</code>)이 아직 없습니다. 담당자가 <code>supabase/content_requests.sql</code> 적용 후 사용 가능합니다.'; btn.disabled=false; btn.innerHTML=o; }
    else { box.textContent='요청 오류: '+res.reason; btn.disabled=false; btn.innerHTML=o; }
  };
}

// ── 소스 ─────────────────────────────────────────────────────────────────────
function renderSources(){
  const s=DATA.sources||{images:[],guidelines:''};
  const grid=(s.images||[]).map(im=>`<div class="src"><img src="${esc(im.url)}" alt="">
    <div class="m"><span>${esc(im.label)}</span><div class="toggle ${im.active?'on':''}" data-id="${esc(im.id)}"></div></div></div>`).join('');
  $('view').innerHTML=`<div class="head"><div><h1>소스</h1><div class="sub">생성 시 참고하는 이미지·지침. 켜둔 자료만 사용됩니다.</div></div></div>
    <h2 class="sec">참고 이미지</h2>
    <div class="drop"><i class="ti ti-upload"></i>이미지를 끌어다 놓거나 클릭해서 업로드 (배경·스타일 참고용)</div>
    <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(160px,1fr));margin-top:14px">${grid||'<div class="note">업로드된 이미지 없음</div>'}</div>
    <h2 class="sec" style="margin-top:26px">지침</h2>
    <textarea class="body" id="gl" style="min-height:150px">${esc(s.guidelines||'')}</textarea>
    <div class="row"><button class="pri" id="glsave"><i class="ti ti-device-floppy"></i> 지침 저장</button>
      <span class="note">생성 시 <code>sourceMaterials</code> + guideline-reviewer 에 반영</span></div>`;
  $('view').querySelectorAll('.toggle').forEach(t=>t.onclick=async()=>{
    const on=!t.classList.contains('on'); t.classList.toggle('on'); const id=t.dataset.id;
    if(DEMO){ toast('데모 모드 — 토글만'); return; }
    if(!id){ toast('사용 여부 저장됨'); return; }
    const { error } = await sb.from('sources').update({active:on}).eq('id',id);
    toast(error?'저장 오류: '+error.message:'사용 여부 저장됨');
  });
  $('glsave').onclick=async()=>{
    if(DEMO){ toast('데모 모드 — 저장 안 됨'); return; }
    const okv=await saveGuideline($('gl').value.trim()); toast(okv?'지침 저장됨':'저장 오류');
  };
  $('view').querySelector('.drop').onclick=()=>toast('이미지 업로드는 service_role 필요 — 엔진(brand/image-stock)에서 관리');
}

    <div class="v">${esc(l.v)} <span class="lock"><i class="ti ti-lock" style="font-size:11px"></i>잠금</span></div></div>`).join('');

      <div class="kv"><div class="k"><i class="ti ti-brand-instagram"></i>공식 핸들</div><div class="v">${esc(b.handle||'')}</div></div>${locks}</div>
    <h2 class="sec" style="margin-top:24px">톤 <span class="note">(현재: ${esc(TONE[b.tone]||b.tone||'')})</span></h2><div>${tones}</div>
    <h2 class="sec" style="margin-top:22px">기본 해시태그</h2><div>${tags}</div>
    <h2 class="sec" style="margin-top:22px">금기어 <span class="note">(생성·검수에서 차단)</span></h2><div>${no}</div>`;

// ── 학습 · 업그레이드 ────────────────────────────────────────────────────────
function renderLearning(){
  const all=DATA.learnings||[];
  const active=all.filter(r=>r.active!==false), proposed=all.filter(r=>r.active===false);
  const rules=active.map(r=>`<div class="rule"><span class="b ${r.kind}">${r.kind==='do'?'DO':'DONT'}</span>
    <span>${esc(r.rule)}</span><span class="sc">${esc(r.scope)} · w${r.weight}</span></div>`).join('')||'<div class="note">누적 학습 없음</div>';
  const props=proposed.map(p=>`<div class="card" data-id="${esc(p.id)}"><div class="ch"><div class="l"><i class="ti ti-arrow-up-circle"></i>
    <span class="name">${esc(p.rule)}</span><span class="pill warn">검토 대기</span></div></div>
    <div class="note" style="margin:6px 0 0">${esc(p.scope)} · ${p.kind==='do'?'DO':'DONT'} · w${p.weight}${p.source?' · '+esc(p.source):''}</div>
    <div class="row"><button class="pri prop-ok"><i class="ti ti-check"></i> 승인 · 반영</button><button class="prop-hold">보류</button></div></div>`).join('')
    ||'<div class="note">검토할 개선안 없음</div>';
  $('view').innerHTML=`<div class="head"><div><h1>학습 · 업그레이드</h1>
    <div class="sub">피드백에서 누적된 규칙 + 주기적 개선안. 승인하면 다음 생성부터 자동 주입됩니다.</div></div></div>
    <h2 class="sec">에이전트 업그레이드 제안 <span class="note">(distill → 검토 대기)</span></h2>${props}
    <h2 class="sec" style="margin-top:24px">누적 학습 규칙 <span class="note">(매 생성 시 자동 주입)</span></h2>
    <div class="card">${rules}</div>`;
  $('view').querySelectorAll('.prop-ok').forEach(b=>b.onclick=async()=>{
    const card=b.closest('[data-id]'), id=card&&card.dataset.id;
    if(DEMO){ toast('데모 — 승인 시 지침에 반영'); return; }
    if(!id){ toast('승인됨'); return; }
    const { error } = await sb.from('learnings').update({active:true}).eq('id',id);
    if(error){ toast('오류: '+error.message); return; }
    const row=all.find(r=>String(r.id)===String(id)); if(row)row.active=true;
    toast('승인 · 반영됨 (다음 생성부터 주입)'); renderLearning();
  });
  $('view').querySelectorAll('.prop-hold').forEach(b=>b.onclick=()=>toast('보류'));
}

    <div class="row" style="margin:0 0 12px">

  $('view').innerHTML=`<div class="head"><div><h1>설정</h1><div class="sub">연결·채널·접근 링크.</div></div></div>
    <div class="card">
      <div class="kv"><div class="k"><i class="ti ti-database"></i>Supabase</div><div class="v">${DEMO?'<span class="pill warn">미연결 (데모)</span>':'<span class="pill ok">연결됨</span>'}</div></div>
      <div class="kv"><div class="k"><i class="ti ti-link"></i>비공개 링크</div><div class="v note">이 배포 URL을 클라에게만 공유</div></div>
      <div class="kv"><div class="k"><i class="ti ti-refresh"></i>마지막 push</div><div class="v note">오늘 09:00</div></div>
    </div>
    <h2 class="sec" style="margin-top:24px">채널</h2>
    <div class="card">${['instagram','threads','naver-blog','linkedin'].map((c,i)=>`<div class="kv"><div class="k"><i class="ti ${CH[c].icon}"></i>${CH[c].label}</div><div class="toggle ${i<3?'on':''}"></div></div>`).join('')}</div>`;
  $('view').querySelectorAll('.toggle').forEach(t=>t.onclick=()=>{t.classList.toggle('on');toast(DEMO?'데모 모드':'채널 설정 저장됨')});

// ── 사실 검증 (작가·기자 레이어) ─────────────────────────────────────────────
// fact_candidates 는 loadAll 4테이블과 분리해 자체 조회 — 테이블이 없어도 콘솔 전체는 안 깨짐.
// anon 은 SELECT + UPDATE(status, note)만 가능. merged 는 로컬 병합 스크립트만 세팅.
const REL={'peer-reviewed':{l:'피어리뷰',c:'ok'},institution:{l:'기관',c:'info'},industry:{l:'업계',c:'warn'},media:{l:'미디어',c:''}};
const relPill=r=>{const m=REL[r]||{l:r||'출처 미상',c:''};return `<span class="pill ${m.c}">${esc(m.l)}</span>`;};
const factMeta=f=>[f.publisher,f.published_at?String(f.published_at).slice(0,10):null,f.source_title,f.dossier_ref?'도시어 '+f.dossier_ref:null].filter(Boolean).map(esc).join(' · ');
async function patchFact(id,fields){
  if(DEMO){ toast('데모 모드 — 저장 안 됨'); return false; }
  const { error } = await sb.from('fact_candidates').update(fields).eq('id',id);
  if(error){ toast('저장 오류: '+error.message); return false; } return true;
}
function factCard(f,pending){
  const done = f.status==='approved'
    ? (f.merged?'<span class="pill ok">✅ 병합 완료</span>':'<span class="pill info">승인됨 · 로컬 --pull 대기</span>')
    : f.status==='rejected'?'<span class="pill" style="background:var(--dangerbg);color:var(--danger);border-color:transparent">반려됨</span>':'';
  return `<div class="card" data-fid="${esc(f.id)}">
    <div class="ch"><div class="l"><i class="ti ti-checklist"></i><span class="name">${esc(f.claim||'(claim 없음)')}</span></div>
      <span style="display:flex;gap:6px;align-items:center">${relPill(f.reliability)}${done}</span></div>
    ${f.value?`<div style="font-size:15px;font-weight:600;margin:2px 0 4px">${esc(f.value)}</div>`:''}
    <div class="note">${factMeta(f)||'출처 정보 없음'}</div>
    ${f.quote?`<div style="border-left:3px solid var(--line2);padding:6px 12px;margin:10px 0 2px;color:var(--dim);font-size:13px;line-height:1.6">“${esc(f.quote)}”</div>`:''}
    ${f.url?`<div style="margin-top:8px"><a class="pill" href="${esc(f.url)}" target="_blank" rel="noopener" style="text-decoration:none;display:inline-flex;align-items:center;gap:5px"><i class="ti ti-external-link" style="font-size:12px"></i> 원문 보기</a></div>`:''}
    ${pending?`<div class="lab">메모 (선택 — 승인/반려와 함께 저장)</div>
    <input type="text" class="fnote" placeholder="예: 수치는 초록 기준 — 병합 전 본문 재확인" value="${esc(f.note||'')}">
    <div class="row"><button class="pri f-appr"><i class="ti ti-check"></i> 승인</button>
      <button class="f-rej"><i class="ti ti-ban"></i> 반려</button></div>`
    :(f.note?`<div class="note" style="margin-top:8px"><i class="ti ti-note"></i> ${esc(f.note)}</div>`:'')}
  </div>`;
}
async function renderFacts(){
  const head=`<div class="head"><div><h1>사실 검증</h1>
    <div class="sub">아티클 도시어의 사실 후보 검토 — 승인분은 로컬 <code>--pull</code> 시 verified-sources 로 병합됩니다.</div></div></div>`;
  $('view').innerHTML=head+'<div class="note">불러오는 중…</div>';
  let rows=null, err=null;
  if(DEMO){ err='demo'; }
  else{
    try{
      const r=await sb.from('fact_candidates').select('*').order('created_at',{ascending:false});
      if(r.error) err=r.error.message; else rows=r.data||[];
    }catch(e){ err=(e&&e.message)||String(e); }
  }
  const nav=document.querySelector('.nav.on'); if(!nav||nav.dataset.s!=='facts') return; // 로딩 중 뷰 전환 시 덮어쓰기 방지
  if(err==='demo'){ $('view').innerHTML=head+'<div class="note">데모 모드 — Supabase 연결 시 fact_candidates 후보가 표시됩니다.</div>'; return; }
  if(err){
    const missing=/relation|does not exist|not found|schema cache|fact_candidates/i.test(err);
    $('view').innerHTML=head+(missing
      ?'<div class="note"><code>fact_candidates</code> 테이블 없음 — 로컬에서 <code>node scripts/apply-schema.mjs</code> 실행 후 사용 가능합니다.</div>'
      :'<div class="note">조회 오류: '+esc(err)+'</div>');
    return;
  }
  const pending=rows.filter(f=>f.status==='pending'||!f.status);
  const doneRows=rows.filter(f=>f.status==='approved'||f.status==='rejected');
  $('view').innerHTML=head
    +`<h2 class="sec">검토 대기 <span class="note">(${pending.length})</span></h2>`
    +(pending.map(f=>factCard(f,true)).join('')||'<div class="note">대기 중인 사실 후보가 없습니다.</div>')
    +`<h2 class="sec" style="margin-top:26px">처리됨 <span class="note">(${doneRows.length})</span></h2>`
    +(doneRows.map(f=>factCard(f,false)).join('')||'<div class="note">처리된 후보 없음</div>');
  pending.forEach(f=>{
    const el=$('view').querySelector(`[data-fid="${CSS.escape(String(f.id))}"]`); if(!el) return;
    const note=el.querySelector('.fnote');
    const act=async st=>{
      const fields={status:st}; const nv=note.value.trim();
      if(nv!==(f.note||'')) fields.note=nv||null;
      if(await patchFact(f.id,fields)){ toast(st==='approved'?'승인됨 — 로컬 --pull 시 병합':'반려됨'); renderFacts(); }
    };
    el.querySelector('.f-appr').onclick=()=>act('approved');
    el.querySelector('.f-rej').onclick=()=>act('rejected');
  });
}

const VIEWS={today:renderToday,channels:renderChannels,facts:renderFacts,sources:renderSources,brand:renderBrand,learning:renderLearning,calendar:renderCalendar,settings:renderSettings};
function go(s){ document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('on',n.dataset.s===s)); (VIEWS[s]||renderToday)(); window.scrollTo(0,0); }
document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>go(n.dataset.s));

(async()=>{
  const f=$('foot');
  f.className='foot'+(DEMO?' demo':''); f.querySelector('span').textContent=DEMO?'데모 모드 (fixture)':'Supabase 연결됨';
  await loadAll(); go('today');
  if(!DEMO) sb.channel('live').on('postgres_changes',{event:'*',schema:'public',table:'marketing_drafts'},async()=>{await loadAll();go(document.querySelector('.nav.on').dataset.s)}).subscribe();
  // fact_candidates 라이브 — 사실 검증 뷰를 보고 있을 때만 다시 그림(테이블 없으면 이벤트가 없을 뿐, 무해)
  if(!DEMO) sb.channel('live-facts').on('postgres_changes',{event:'*',schema:'public',table:'fact_candidates'},()=>{const n=document.querySelector('.nav.on');if(n&&n.dataset.s==='facts')renderFacts();}).subscribe();
})();
</script>
